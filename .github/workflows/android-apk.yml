name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web files into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a public release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gradebook.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "أحدث نسخة APK" --notes "رابط ثابت لأحدث نسخة من التطبيق" --latest
          gh release upload latest gradebook.apk --clobber
          gh release edit latest --notes "آخر تحديث: $(date -u +%F' '%H:%M) UTC — ${GITHUB_SHA::7}"
