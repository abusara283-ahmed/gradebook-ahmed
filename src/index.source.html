<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل درجات الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* التخطيط: شريط علوي، شريط اختيار الصف، تبويبات (الطلاب / لوحة المعلومات / رصد الدرجات / الإعدادات)، ونافذة الطالب والملاحظة */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#14202b; --muted:#5b6b7a; --line:#dde3e9;
  --accent:#0b6e6e; --accent-soft:#dff1f0; --accent-ink:#ffffff;
  --good:#17794a; --good-soft:#dcf3e6; --mid:#8a5a00; --mid-soft:#fbefd2; --bad:#b3261e; --bad-soft:#fbe0dd; --none:#5b6b7a; --none-soft:#e6eaee;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171d; --surface:#18222b; --ink:#e8eef3; --muted:#93a3b2; --line:#2a3744;
    --accent:#4cc3c0; --accent-soft:#16363a; --accent-ink:#06201f;
    --good:#58d08e; --good-soft:#163a28; --mid:#f0c05a; --mid-soft:#3d3010; --bad:#ff8f86; --bad-soft:#4a1f1c; --none:#93a3b2; --none-soft:#26323d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171d; --surface:#18222b; --ink:#e8eef3; --muted:#93a3b2; --line:#2a3744;
  --accent:#4cc3c0; --accent-soft:#16363a; --accent-ink:#06201f;
  --good:#58d08e; --good-soft:#163a28; --mid:#f0c05a; --mid-soft:#3d3010; --bad:#ff8f86; --bad-soft:#4a1f1c; --none:#93a3b2; --none-soft:#26323d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 12px}
h3{margin:0}
.sub{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.bar-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-top .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;align-items:center}
.chips .lab{color:var(--muted);font-size:13px;white-space:nowrap}
.chip{all:unset;cursor:pointer;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;padding:10px 18px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.notice{border-radius:8px;padding:8px 12px;font-size:14px}
.notice.info{background:var(--accent-soft)}
.notice.warn{background:var(--mid-soft)}
.notice.err{background:var(--bad-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile .k{color:var(--muted);font-size:13px}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .s{font-size:13px;color:var(--muted)}
.tile.flag{border-inline-start:4px solid var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.comp{display:grid;grid-template-columns:140px 1fr 150px;gap:12px;align-items:center;padding:6px 0}
.comp .nums{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:end}
@media (max-width:560px){.comp{grid-template-columns:90px 1fr 110px}}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.weak i{background:var(--mid)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--mid-soft);color:var(--mid)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--none-soft);color:var(--none)}
.pill.plain::before{display:none}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.stack .good,.hist .b.good{background:var(--good)}
.stack .mid,.hist .b.mid{background:var(--mid)}
.stack .bad,.hist .b.bad{background:var(--bad)}
.stack .none{background:var(--none)}
.hist{display:flex;gap:6px;align-items:flex-end;height:150px;margin-top:8px}
.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;font-variant-numeric:tabular-nums}
.hist .b{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.hist .lab{color:var(--muted);font-size:11px;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.toolbar .f{flex:1 1 170px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px;width:100%}
textarea{resize:vertical;min-height:96px;line-height:1.6}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:700px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg);font-weight:600;font-size:13px;color:var(--muted)}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;color:inherit;font-weight:inherit}
th button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
th small{display:block;font-weight:400;font-size:12px}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.seq{color:var(--muted);width:48px}
td.name{white-space:normal;min-width:150px}
.linkname{all:unset;cursor:pointer;font-weight:600;color:var(--ink);border-bottom:1px dashed var(--muted)}
.linkname:hover{color:var(--accent);border-color:var(--accent)}
.linkname:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
td .cell{display:flex;flex-direction:column;gap:3px;min-width:64px}
td .cell .bar{height:4px}
td.na{color:var(--muted)}
.st{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;display:inline-block}
.st.a{background:var(--bad-soft);color:var(--bad)}
.st.e{background:var(--none-soft);color:var(--none)}
td.note{white-space:normal;max-width:210px;min-width:130px;font-size:13px}
td.note button{all:unset;cursor:pointer;display:block;width:100%}
td.note .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.note .add{color:var(--muted);opacity:.8}
td.eval{white-space:normal;min-width:220px;font-size:13px}
.mark{color:var(--bad);font-size:12px;font-weight:600;display:block}
.mini{display:inline-flex;gap:3px;align-items:flex-end;height:30px}
.mini i{display:block;width:9px;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.mini i.low{background:var(--bad)}
.list{display:flex;flex-direction:column}
.list button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.list button:first-child{border-top:0}
.list button:hover{background:var(--accent-soft)}
.list button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.set-grid label,.map label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.gin{width:80px;text-align:center}
.nin{min-width:170px}
input.over{border-color:var(--bad);background:var(--bad-soft)}
input.bad{border-color:var(--bad);background:var(--bad-soft)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rowline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.rowline:first-of-type{border-top:0}
.rowline input[type=text]{flex:1 1 200px}
.rowline input[type=number]{width:100px}
.overlay{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.top{z-index:15}
.panel{background:var(--surface);border-radius:14px;max-width:520px;width:100%;max-height:92%;overflow:auto;padding:20px;border:1px solid var(--line)}
.panel header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}
.panel h3{font-size:20px}
.row2{padding:8px 0;border-top:1px solid var(--line)}
.row2 .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.track{height:10px;background:var(--line);border-radius:5px;position:relative}
.track i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);border-radius:5px}
.track b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.saved{color:var(--good)}
.opt{display:flex;gap:8px;align-items:center;padding:4px 0}
.opt input{width:auto;min-height:0}
.grp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.grp legend{font-weight:600;padding:0 6px;font-size:14px}
#toast{position:fixed;inset-inline:16px;bottom:16px;max-width:520px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline}
#toast button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#dropHint{position:fixed;inset:0;z-index:40;background:rgba(11,110,110,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
[hidden]{display:none!important}
.entry table{min-width:0;max-width:560px}
.entry .gin{width:110px;font-size:17px}
/* صفحات PDF: ألوان ثابتة فاتحة بغض النظر عن سمة العرض */
#stage{position:fixed;left:-20000px;top:0;direction:rtl;font-family:var(--font)}
.pg{background:#fff;color:#111;padding:28px 32px;position:relative;overflow:hidden;font-size:13px;line-height:1.5}
.pg.land{width:1122px;height:794px}
.pg.port{width:794px;height:1123px}
.pg .pgh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--pc,#0b6e6e);padding-bottom:8px;margin-bottom:10px}
.pg .pt{font-size:20px;font-weight:700;color:var(--pc,#0b6e6e)}
.pg .ps{color:#5b6b7a;font-size:12px}
.pg .pn{color:#5b6b7a;font-size:12px}
.pg .phb{position:absolute;top:0;inset-inline:0;height:6px;background:linear-gradient(270deg,var(--pc,#0b6e6e),var(--pc2,#4cc3c0))}
.pg .ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:6px 0 10px;border-bottom:1px solid #cfd8de;margin-bottom:10px;min-height:84px}
.pg .ph-r{display:flex;align-items:center;gap:14px}
.pg .ph-r .lg{max-height:68px;max-width:110px;object-fit:contain}
.pg .ph-school{font-size:19px;font-weight:700;color:var(--pcd,#0b4f4f);line-height:1.3}
.pg .ph-sub{color:#5b6b7a;font-size:12px}
.pg .ph-c{text-align:center}
.pg .ph-title{display:inline-block;font-size:16px;font-weight:700;background:var(--pc,#0b6e6e);color:#fff;padding:5px 22px;border-radius:999px}
.pg .ph-date{color:#7a8794;font-size:11px;margin-top:5px}
.pg .ph-l{font-size:12px;line-height:1.75;color:#33424f;justify-self:end;min-width:180px}
.pg .ph-l span{color:#7a8794}
.pg .pgf2{position:absolute;inset-inline:32px;bottom:12px}
.pg .sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.pg .sl{font-size:11px;color:#7a8794}
.pg .sn{font-weight:700;font-size:13px;min-height:20px}
.pg .sline{border-bottom:1px solid #9aa7b2;height:22px;position:relative}
.pg .sline span{position:absolute;inset-inline-start:0;bottom:3px;font-size:10px;color:#9aa7b2}
.pg .fb{display:flex;justify-content:space-between;font-size:10px;color:#8895a1;margin-top:8px;border-top:1px solid #e3e9ee;padding-top:4px}
.pg{font-family:var(--pf,var(--font))}
.pg .ph{grid-template-columns:1fr 1fr 1fr}
.pg .ph-r{flex-direction:column;align-items:flex-start;gap:4px}
.pg .ph-r .lg{max-height:62px;max-width:130px}
.pg .ph-school{font-size:17px}
.pg .ph-c{text-align:center}
.pg .ph-subj{font-size:19px;font-weight:var(--pwh,700);color:var(--pcd,#0b4f4f);line-height:1.3}
.pg .ph-term{display:flex;gap:8px;justify-content:center;color:#5b6b7a;font-size:12.5px;margin-top:3px}
.pg .ph-l{justify-self:end;text-align:left;min-width:0}
.pg .ph-l .k{font-size:11px;color:#7a8794}
.pg .ph-l .v{font-size:19px;font-weight:var(--pwh,700);color:var(--pcd,#0b4f4f);line-height:1.3}
.pg .tt{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}
.pg .ph-title{color:var(--pct,#fff);font-size:15px;padding:4px 20px}
.pg .ph-date{margin-top:0}
.pg table.pgt td{font-weight:var(--pw,400)}
.pg table.pgt th{font-weight:var(--pwh,700)}
.pg .sn,.pg .ph-school,.pg .ph-title{font-weight:var(--pwh,700)}
.pg.cmp .ph-subj,.pg.cmp .ph-l .v{font-size:16px}
.pg.bw .lv{color:#111!important}
.pg.bw .rbar i{background:#444}
.pg.bw .phb{background:#222}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--ink,#111);outline-offset:2px}
.chk-row{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 12px}
.chk-row label{display:flex;gap:6px;align-items:center;font-size:14px}
body.locked .wrap{display:none}
#lock{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.lbox input{text-align:center;font-size:24px;letter-spacing:8px}
#lockErr{color:var(--bad);min-height:20px;font-size:14px}
.syncb{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--surface);cursor:pointer;color:var(--muted);font-family:inherit}
.syncb.ok{color:var(--good)}.syncb.warn{color:var(--bad)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.tg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tg .x{border:0;background:none;cursor:pointer;color:inherit;font-size:15px;padding:0 2px}
.tagmini{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tagmini span{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px}
.strug{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.codebox{background:var(--accent-soft);border-radius:12px;padding:12px;margin:10px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:2px;margin:6px 0;direction:ltr;text-align:center;user-select:all}
.pg .sm-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.pg .sm-tiles .box{margin:0;padding:8px 10px}
.pg .sm-tiles .big{font-size:22px}
.pg .stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#e3e9ee}
.pg .stk i.good,.pg .lgd i.good{background:#2e8b57}.pg .stk i.mid,.pg .lgd i.mid{background:#d9a21b}.pg .stk i.bad,.pg .lgd i.bad{background:#c0392b}.pg .stk i.none,.pg .lgd i.none{background:#9aa7b2}
.pg.bw .stk i,.pg.bw .lgd i{filter:grayscale(1)}
.pg .lgd{display:flex;gap:14px;margin-top:6px;font-size:12px}
.pg .lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px}
.pg .srow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:5px 0;font-size:13px}
.pg .srow2{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed #dde3e8;font-size:13px}
.pg .sm2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pg .sm2 .box{margin:0 0 12px}
.logo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pg table.pgt{min-width:0;width:100%;table-layout:fixed;border-collapse:collapse}
.pg table.pgt th{background:var(--pcl,#eef3f5);color:#33424f;font-size:12px;padding:6px 8px;border:1px solid #d5dde3;height:44px;white-space:normal}
.pg table.pgt td{padding:0 8px;border:1px solid #d5dde3;height:var(--rh,34px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:var(--fs,13px);color:#111}
.pg.cdpg{padding:20px}
.cdgrid{display:grid;direction:rtl;align-content:start}
.cd{box-sizing:border-box;border:1.5px dashed #9aa8b3;border-radius:10px;padding:8px 12px;overflow:hidden;position:relative;background:#fff}
.cd::before{content:'';position:absolute;top:0;inset-inline:0;height:4px;background:linear-gradient(270deg,var(--pc,#0b6e6e),var(--pc2,#4cc3c0))}
.cd-top{display:flex;justify-content:space-between;color:#5b6b7a;font-size:.85em;margin-top:2px}
.cd-cls{font-weight:700;color:var(--pc,#0b6e6e)}
.cd-name{font-weight:700;margin:3px 0 4px;line-height:1.3;white-space:nowrap;overflow:hidden}

<script>
(function(){
'use strict';
var DEF_TOOLS=[{k:'oral',l:'الأعمال الشفوية'},{k:'quiz',l:'السؤال القصير'},{k:'t1',l:'الاختبار القصير (1)'},{k:'t2',l:'الاختبار القصير (2)'}];
var LV={good:'ممتاز',mid:'جيد',bad:'يحتاج دعمًا',none:'لم تُرصد'};
var NK='gradebook-notes-v1',DK1='gradebook-data-v1',DK2='gradebook-data-v2',BK='gradebook-lastbackup';
var PK='gradebook-profile-v1',PDK='gradebook-pdf-v1';
var S={pdf:{cols:{},tot:true,pct:true,lv:true,font:'plex',weight:'normal',color:'#0b6e6e',bw:false,size:'auto'},profile:{school:'',logo:'',sem:'',year:'',subject:'',teacher:'',supervisor:'',principal:'',cc:'968'},tools:JSON.parse(JSON.stringify(DEF_TOOLS)),classes:[],view:'all',sample:true,src:'',th:{hi:85,lo:50},nextId:1,nt:{},noStore:false,
  tab:'students',sortK:'seq',sortDir:1,q:'',lvl:'',noteF:'',msgs:[],cur:-1,curTool:'',pendOnly:false,undo:[],mdActs:[]};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,d){d=d==null?1:d;if(n==null||isNaN(n))return '—';var f=Math.pow(10,d);return (Math.round(n*f)/f).toLocaleString('en',{maximumFractionDigits:d})}
function P(n){return '⁦'+Math.round(n)+'%⁩'}
function dname(s){return s.name||'(بدون اسم)'}
function norm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-0x660})
    .replace(/[ً-ْـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/\s+/g,' ').trim();
}
function num(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  var s=String(v).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-0x660}).replace(/٫/g,'.').replace(/,/g,'.').trim();
  if(!/^-?\d*\.?\d+$/.test(s))return null;
  return parseFloat(s);
}
function toolById(k){for(var i=0;i<S.tools.length;i++)if(S.tools[i].k===k)return S.tools[i];return null}
function today(){return new Date().toLocaleDateString('ar-u-nu-latn',{year:'numeric',month:'long',day:'numeric'})}

/* ---------- نموذج البيانات ---------- */
function newStudent(name){return {id:S.nextId++,name:name||'',g:{},x:{},f:null}}
function newClass(name){var m={};S.tools.forEach(function(t){m[t.k]=10});return {id:S.nextId++,name:name,max:m,students:[],rows:null}}
function allStu(){var a=[];S.classes.forEach(function(c){c.students.forEach(function(s){a.push(s)})});return a}
function byId(id){var a=allStu();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function curClass(){for(var i=0;i<S.classes.length;i++)if(S.classes[i].id===S.view)return S.classes[i];return null}
function pool(){if(S.view==='all')return allStu();var c=curClass();return c?c.students:[]}
function bySeq(a,b){return a.seq-b.seq}
function uniqueClassName(n){
  var base=(n||'صف').trim()||'صف',name=base,i=2;
  function has(x){return S.classes.some(function(c){return c.name===x})}
  while(has(name))name=base+' ('+(i++)+')';
  return name;
}
function parseCell(t){
  t=String(t==null?'':t).trim();
  if(t==='')return {ok:true,v:null,x:null};
  var n=norm(t);
  if(/^(غ|غائب|غايب)$/.test(n))return {ok:true,v:null,x:'a'};
  if(/^(ع|معفي|معفيه)$/.test(n))return {ok:true,v:null,x:'e'};
  var v=num(t);
  if(v==null||v<0)return {ok:false};
  return {ok:true,v:v,x:null};
}
function setCell(s,k,p){s.g[k]=p.v;if(p.x)s.x[k]=p.x;else delete s.x[k];s.f=null}
function cellText(s,k){var x=s.x[k];if(x==='a')return 'غ';if(x==='e')return 'ع';return s.g[k]==null?'':String(s.g[k])}

function calc(){
  S.classes.forEach(function(c){
    var act=S.tools.filter(function(t){return c.students.some(function(s){return s.g[t.k]!=null||s.x[t.k]})});
    if(!act.length)act=S.tools.slice();
    c.activeKeys={};act.forEach(function(t){c.activeKeys[t.k]=1});
    var mt=0;act.forEach(function(t){mt+=+c.max[t.k]||0});c.maxTotal=mt||1;
    c.students.forEach(function(s){
      s.c=c;
      var sum=0,poss=0,rec=0,pend=0,exc=0,abs=0;
      S.tools.forEach(function(t){
        if(!c.activeKeys[t.k])return;
        var m=+c.max[t.k]||0,x=s.x[t.k],v=s.g[t.k];
        if(x==='e'){exc++;return}
        if(x==='a'){abs++;rec++;poss+=m;return}
        if(v!=null){sum+=v;poss+=m;rec++}else pend++;
      });
      s.sum=sum;s.poss=poss;s.rec=rec;s.pend=pend;s.exc=exc;s.abs=abs;
      if(rec===0&&s.f!=null){s.sum=s.f;s.poss=c.maxTotal}
      s.calc=s.sum;
      s.pct=s.poss>0?s.sum/s.poss*100:0;
      s.none=(rec===0&&s.f==null);
      s.lv=s.none?'none':(s.pct>=S.th.hi?'good':(s.pct>=S.th.lo?'mid':'bad'));
      s.mismatch=s.f!=null&&rec>0&&pend===0&&exc===0&&Math.abs(s.f-s.sum)>0.01;
    });
    var sorted=c.students.filter(function(s){return !s.none}).sort(function(a,b){return b.pct-a.pct});
    sorted.forEach(function(s,i){s.rank=(i>0&&Math.abs(s.pct-sorted[i-1].pct)<1e-9)?sorted[i-1].rank:i+1});
    c.students.forEach(function(s){if(s.none)s.rank=null});
    c.ranked=sorted.length;
    var byName=c.students.slice().sort(function(a,b){
      var x=norm(a.name),y=norm(b.name);
      if(!x&&y)return 1;if(x&&!y)return -1;
      return x.localeCompare(y,'ar')||a.id-b.id;
    });
    byName.forEach(function(s,i){s.seq=i+1});
  });
}

/* ---------- الملاحظات ---------- */
try{S.nt=JSON.parse(localStorage.getItem(NK)||'{}')||{}}catch(e){S.nt={};S.noStore=true}
function nkeyFor(sample,cname,sname){return (sample?'s:':'r:')+norm(cname)+'|'+norm(sname)}
function nkey(s){return nkeyFor(S.sample,s.c?s.c.name:'',s.name)}
function getNote(s){return S.nt[nkey(s)]||''}
try{var pp0=JSON.parse(localStorage.getItem(PK)||'null');if(pp0)Object.keys(S.profile).forEach(function(k){if(typeof pp0[k]==='string')S.profile[k]=pp0[k]})}catch(e){}
try{var pd0=JSON.parse(localStorage.getItem(PDK)||'null');if(pd0&&typeof pd0==='object')Object.keys(pd0).forEach(function(k){if(k in S.pdf)S.pdf[k]=pd0[k]})}catch(e){}
function saveProfile(){try{localStorage.setItem(PK,JSON.stringify(S.profile))}catch(e){S.noStore=true}syncMark()}
function saveNotes(){try{localStorage.setItem(NK,JSON.stringify(S.nt))}catch(e){S.noStore=true}syncMark()}
function setNote(s,t){var k=nkey(s);if(t.trim())S.nt[k]=t;else delete S.nt[k];saveNotes()}

/* ---------- الحفظ والاستعادة والتراجع ---------- */
function snapshot(){
  var vi='all';S.classes.forEach(function(c,i){if(c.id===S.view)vi=i});
  return {v:2,tools:S.tools,th:S.th,view:vi,src:S.src,
    classes:S.classes.map(function(c){return {n:c.name,max:c.max,st:c.students.map(function(s){return {n:s.name,g:s.g,x:s.x,f:s.f}})}})};
}
function load(d){
  S.tools=JSON.parse(JSON.stringify(d.tools&&d.tools.length?d.tools:DEF_TOOLS));
  S.th=d.th||{hi:85,lo:50};S.src=d.src||'';
  S.classes=(d.classes||[]).map(function(c){
    var k=newClass(c.n||'صف');
    S.tools.forEach(function(t){k.max[t.k]=(c.max&&+c.max[t.k]>0)?+c.max[t.k]:10});
    k.students=(c.st||[]).map(function(r){var s=newStudent(r.n||'');s.g=r.g||{};s.x=r.x||{};s.f=r.f==null?null:r.f;return s});
    return k;
  });
  var v=d.view;
  S.view=(typeof v==='number'&&S.classes[v])?S.classes[v].id:(S.classes.length===1?S.classes[0].id:(S.classes[0]?S.classes[0].id:'all'));
  if(S.classes.length&&d.view==='all'&&S.classes.length>1)S.view='all';
  calc();
}
function persist(){
  if(S.sample)return;
  try{localStorage.setItem(DK2,JSON.stringify(snapshot()))}catch(e){S.noStore=true}
  syncMark();
}
function restore(){
  try{
    var d2=JSON.parse(localStorage.getItem(DK2)||'null');
    if(d2&&d2.classes){load(d2);S.sample=false;return true}
    var d1=JSON.parse(localStorage.getItem(DK1)||'null');
    if(d1&&d1.st){ // ترحيل من النسخة الأولى: صف واحد
      var cn='الصف';
      load({tools:DEF_TOOLS,th:d1.th,src:d1.src,view:0,classes:[{n:cn,max:d1.max,st:d1.st.map(function(r){var g={};g.oral=r.o;g.quiz=r.q;g.t1=r.a;g.t2=r.b;return {n:r.n,g:g,x:{},f:r.f}})}]});
      S.sample=false;
      d1.st.forEach(function(r){var o='r:'+norm(r.n),n=nkeyFor(false,cn,r.n);if(S.nt[o]&&!S.nt[n])S.nt[n]=S.nt[o]});
      saveNotes();persist();return true;
    }
  }catch(e){}
  return false;
}
function leaveSample(src){
  if(!S.sample)return;
  var move={};
  Object.keys(S.nt).forEach(function(k){if(k.indexOf('s:')===0){move['r:'+k.slice(2)]=S.nt[k];delete S.nt[k]}});
  Object.keys(move).forEach(function(k){S.nt[k]=move[k]});
  var tmv={};Object.keys(S.tg||{}).forEach(function(k){if(k.indexOf('s:')===0){tmv['r:'+k.slice(2)]=S.tg[k];delete S.tg[k]}});Object.keys(tmv).forEach(function(k){S.tg[k]=tmv[k]});
  var pmv={};Object.keys(S.ph||{}).forEach(function(k){if(k.indexOf('s:')===0){pmv['r:'+k.slice(2)]=S.ph[k];delete S.ph[k]}});Object.keys(pmv).forEach(function(k){S.ph[k]=pmv[k]});savePh();
  saveNotes();saveTags();
  S.sample=false;S.src=src||'بيانات مُدخلة يدويًا';
}
var lastUndoAt=0,lastUndoLabel='';
function pushUndo(label){
  S.undo.push({label:label,snap:JSON.stringify(snapshot()),sample:S.sample});
  if(S.undo.length>25)S.undo.shift();
  lastUndoAt=Date.now();lastUndoLabel=label;renderUndoBtn();
}
function undoMark(label,ms){if(Date.now()-lastUndoAt>ms||lastUndoLabel!==label)pushUndo(label)}
function renderUndoBtn(){
  var b=$('undoBtn'),e=S.undo[S.undo.length-1];
  b.disabled=!e;b.title=e?('التراجع عن: '+e.label):'لا توجد خطوات للتراجع';
}
function doUndo(){
  var e=S.undo.pop();if(!e)return;
  load(JSON.parse(e.snap));S.sample=e.sample;persist();
  lastUndoAt=0;lastUndoLabel='';renderUndoBtn();renderCurrent();
  toast('تم التراجع عن: '+e.label,false);
}
var toastT=null;
function toast(msg,withUndo){
  $('toastMsg').textContent=msg;$('toastUndo').hidden=!withUndo;$('toast').hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){$('toast').hidden=true},withUndo?8000:3500);
}

/* ---------- قراءة ملف الإكسل: كل ورقة = صف ---------- */
function classify(t){
  var n=norm(t); if(!n)return null;
  if(/مجموع|اجمالي|total|sum/.test(n))return 'total';
  if(/شفو|oral/.test(n))return 'oral';
  if(n.indexOf('قصير')>-1||/quiz|test/.test(n)){
    if(n.indexOf('اختبار')>-1||/test/.test(n)){
      if(/(^|[^0-9])1([^0-9]|$)/.test(n)||/اول/.test(n))return 't1';
      if(/(^|[^0-9])2([^0-9]|$)/.test(n)||/ثاني/.test(n))return 't2';
      return 'test?';
    }
    return 'quiz';
  }
  if(/سوال/.test(n))return 'quiz';
  if(/اسم|طالب|name|student/.test(n))return 'name';
  return null;
}
function detect(rows){
  var best=-1,bestCount=0,bestMap=null;
  for(var r=0;r<Math.min(rows.length,25);r++){
    var map={},count=0,pend=[];
    (rows[r]||[]).forEach(function(c,i){
      var k=classify(c); if(!k)return;
      if(k==='test?'){pend.push(i);return}
      if(map[k]==null){map[k]=i;count++}
    });
    pend.forEach(function(i){if(map.t1==null){map.t1=i;count++}else if(map.t2==null){map.t2=i;count++}});
    if(count>bestCount){bestCount=count;best=r;bestMap=map}
  }
  if(bestCount>=3)return {hdr:best,map:bestMap,auto:true};
  return {hdr:0,map:{name:0,oral:1,quiz:2,t1:3,t2:4,total:5},auto:false};
}
function buildClass(c,keepMax){
  var rows=c.rows,map=c.map,out=[];
  for(var r=c.hdr+1;r<rows.length;r++){
    var row=rows[r]||[];
    var name=map.name!=null&&map.name>=0?String(row[map.name]==null?'':row[map.name]).trim():'';
    var s=newStudent(name),any=false;
    S.tools.forEach(function(t){
      var i=map[t.k];if(i==null||i<0)return;
      var raw=row[i],p=(typeof raw==='number')?{ok:true,v:raw,x:null}:parseCell(raw);
      if(p.ok&&(p.v!=null||p.x)){s.g[t.k]=p.v;if(p.x)s.x[t.k]=p.x;any=true}
    });
    if(map.total!=null&&map.total>=0)s.f=num(row[map.total]);
    var nn=norm(name);
    if(/^الدرجه العظمي/.test(nn))continue;
    if(!name&&!any&&s.f==null)continue;
    if(/^(المجموع|المتوسط|المعدل|اعلي|اقل|اجمالي)/.test(nn)&&!any)continue;
    if(!name)s.name='طالب بلا اسم (صف '+(r+1)+')';
    out.push(s);
  }
  c.students=out;
  if(!keepMax){
    S.tools.forEach(function(t){
      var m=0;out.forEach(function(s){if(s.g[t.k]!=null&&s.g[t.k]>m)m=s.g[t.k]});
      c.max[t.k]=m>0?m:10;
    });
  }
}
function parseWorkbook(wb){
  var res=[],skipped=[],warns=[];
  wb.SheetNames.forEach(function(n){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true,blankrows:false});
    if(rows.length<2){skipped.push(n);return}
    var d=detect(rows),c=newClass(n);
    c.rows=rows;c.hdr=d.hdr;c.map=d.map;
    buildClass(c,false);
    if(!c.students.length){skipped.push(n);return}
    if(!d.auto)warns.push('في ورقة «'+n+'» لم أتعرف على العناوين تلقائيًا فاعتمدت الترتيب: الاسم ثم الأدوات الأربع ثم المجموع. صحّح الربط من الإعدادات إن لزم.');
    else{
      var miss=[];S.tools.forEach(function(t){if(c.map[t.k]==null&&(t.k==='oral'||t.k==='quiz'||t.k==='t1'||t.k==='t2'))miss.push(t.l)});
      if(c.map.name==null)miss.unshift('اسم الطالب');
      if(miss.length)warns.push('في ورقة «'+n+'» لم أجد عمودًا لـ: '+miss.join('، ')+'.');
    }
    res.push(c);
  });
  return {classes:res,skipped:skipped,warns:warns};
}
function applyImport(parsed,fname,mode){
  pushUndo(mode==='add'?'إضافة صفوف من ملف':'رفع ملف');
  if(mode!=='add'){leaveSample();S.classes=[]}
  leaveSample(fname);
  parsed.classes.forEach(function(c){c.name=uniqueClassName(c.name);S.classes.push(c)});
  S.sample=false;S.src=fname;
  S.view=parsed.classes[0].id;
  S.msgs=parsed.warns.map(function(m){return {t:'warn',m:m}});
  if(parsed.skipped.length)S.msgs.push({t:'info',m:'تم تجاهل أوراق لا تحتوي طلابًا: '+parsed.skipped.join('، ')+'.'});
  calc();persist();showTab('students');
  toast('تم رفع '+parsed.classes.length+' صف/صفوف',true);
}
function loadFile(f){
  if(!f)return;
  if(typeof XLSX==='undefined'){S.msgs=[{t:'err',m:'تعذّر تحميل مكتبة قراءة الإكسل. تحقق من الاتصال بالإنترنت وأعد فتح الصفحة.'}];renderCurrent();return}
  var rd=new FileReader();
  rd.onerror=function(){S.msgs=[{t:'err',m:'تعذّر فتح الملف. جرّب حفظه مرة أخرى بصيغة xlsx.'}];renderCurrent()};
  rd.onload=function(e){
    var parsed;
    try{parsed=parseWorkbook(XLSX.read(new Uint8Array(e.target.result),{type:'array'}))}
    catch(err){S.msgs=[{t:'err',m:'الملف غير صالح أو تالف. تأكد أنه ملف إكسل (xlsx أو xls) أو csv.'}];renderCurrent();return}
    if(!parsed.classes.length){S.msgs=[{t:'err',m:'لم أجد صفوف طلاب في أي ورقة. تأكد أن الأسماء والدرجات تحت صف العناوين.'}];renderCurrent();return}
    if(S.sample||!S.classes.length){applyImport(parsed,f.name,'replace');return}
    openModal({title:'رفع ملف جديد',
      body:'<p>وجدت '+parsed.classes.length+' صف/صفوف في «'+esc(f.name)+'»: '+parsed.classes.map(function(c){return esc(c.name)}).join('، ')+'.</p><p class="sub">لديك الآن '+S.classes.length+' صف/صفوف محفوظة. ماذا تريد؟</p>',
      actions:[
        {label:'استبدال الصفوف الحالية',kind:'danger',fn:function(close){close();applyImport(parsed,f.name,'replace')}},
        {label:'إضافتها إلى الصفوف الحالية',fn:function(close){close();applyImport(parsed,f.name,'add')}},
        {label:'إلغاء',kind:'ghost',fn:function(close){close()}}]});
  };
  rd.readAsArrayBuffer(f);
}

function loadSample(){
  var A=['أحمد سالم','محمد خالد','يوسف ناصر','عمر حمد','سعيد علي','خالد راشد','ماجد سيف','حمدان زايد','علي مبارك','سلطان هلال','فهد عامر','بدر منصور','طلال إبراهيم','نوح صالح','زياد حسن','إياد فيصل','مالك جابر','رائد عيسى'];
  var B=['آدم سعود','باسل ياسر','جاسم نبيل','حازم وليد','رامي عادل','سامي كمال','عادل رشاد','غانم صقر','كريم منذر','لؤي جمال','نادر هاني','وائل سليم'];
  var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  S.tools=JSON.parse(JSON.stringify(DEF_TOOLS));S.th={hi:85,lo:50};S.classes=[];
  [['العاشر أ',A],['العاشر ب',B]].forEach(function(pair,ci){
    var c=newClass(pair[0]);
    pair[1].forEach(function(n,i){
      var s=newStudent(n),lvl=0.35+rnd()*0.65;
      s.g.oral=Math.round(10*Math.min(1,lvl+0.1));s.g.quiz=Math.round(10*lvl);
      s.g.t1=Math.round(10*Math.min(1,lvl*(0.8+rnd()*0.25)));s.g.t2=Math.round(10*lvl*(0.7+rnd()*0.3));
      if(ci===0&&i===5){s.g.t2=null}
      if(ci===0&&i===9){s.g.t2=null;s.x.t2='a'}
      if(ci===1&&i===3){s.g.t1=null;s.x.t1='e'}
      if(ci===1&&i===7){s.g.t1=null;s.g.t2=null}
      c.students.push(s);
    });
    c.max={oral:10,quiz:10,t1:10,t2:10};
    S.classes.push(c);
  });
  S.sample=true;S.src='عينة';S.view=S.classes[0].id;calc();
}

/* ---------- إحصاءات ---------- */
function stats(list){
  var scored=list.filter(function(s){return !s.none}),n=list.length;
  var avgPct=scored.length?scored.reduce(function(a,s){return a+s.pct},0)/scored.length:0;
  var avgSum=scored.length?scored.reduce(function(a,s){return a+s.calc},0)/scored.length:0;
  var hi=scored.length?scored.reduce(function(a,s){return s.pct>a.pct?s:a},scored[0]):null;
  var lo=scored.length?scored.reduce(function(a,s){return s.pct<a.pct?s:a},scored[0]):null;
  var cnt={good:0,mid:0,bad:0,none:0};list.forEach(function(s){cnt[s.lv]++});
  var comp={};
  S.tools.forEach(function(t){
    var vals=[],rawv=[],rec=0,total=0;
    list.forEach(function(s){
      var x=s.x[t.k];if(x==='e')return;
      total++;
      var m=+s.c.max[t.k]||0;
      if(x==='a'){rec++;vals.push(0);rawv.push(0);return}
      if(s.g[t.k]!=null){rec++;vals.push(m>0?s.g[t.k]/m*100:0);rawv.push(s.g[t.k])}
    });
    comp[t.k]={pct:vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:null,raw:rawv.length?rawv.reduce(function(a,b){return a+b},0)/rawv.length:null,rec:rec,total:total};
  });
  return {n:n,scored:scored.length,avgPct:avgPct,avgSum:avgSum,hi:hi,lo:lo,cnt:cnt,comp:comp,
    mism:list.filter(function(s){return s.mismatch}).length,
    pending:list.filter(function(s){return s.pend>0&&!s.none}).length,
    notes:list.filter(function(s){return getNote(s)}).length};
}
function weakest(s){
  var w=null,wp=2;
  S.tools.forEach(function(t){
    if(s.x[t.k]||s.g[t.k]==null)return;
    var p=s.g[t.k]/(+s.c.max[t.k]||1);if(p<wp){wp=p;w=t}
  });
  return w?{t:w,p:wp}:null;
}
function evalText(s){
  if(s.none)return 'لم تُرصد درجاته بعد';
  var w=weakest(s),t;
  if(s.lv==='good')t='أداء متميز'+(w&&w.p<0.7?'، ويحسن تعزيز '+w.t.l:'');
  else if(s.lv==='mid')t='أداء جيد'+(w?'، والأضعف: '+w.t.l:'');
  else t='يحتاج دعمًا'+(w?'، خاصة في '+w.t.l:'');
  var ab=[],pe=[];
  S.tools.forEach(function(x){if(s.x[x.k]==='a')ab.push(x.l);else if(s.c.activeKeys[x.k]&&!s.x[x.k]&&s.g[x.k]==null)pe.push(x.l)});
  if(ab.length)t+='. غائب في: '+ab.join('، ');
  if(pe.length)t+='. غير مرصود: '+pe.join('، ');
  return t;
}

function visible(){
  var q=norm(S.q),all=S.view==='all';
  var v=pool().filter(function(s){return (!q||norm(s.name).indexOf(q)>-1)&&(!S.lvl||s.lv===S.lvl)&&(!S.noteF||(S.noteF==='has')===!!getNote(s))&&(!S.tagF||getTags(s).indexOf(S.tagF)>-1)});
  var k=S.sortK,d=S.sortDir;
  v.sort(function(a,b){
    if(k==='seq'&&all){var ia=S.classes.indexOf(a.c),ib=S.classes.indexOf(b.c);if(ia!==ib)return d*(ia-ib)}
    var x=a[k],y=b[k];
    if(k==='name')return d*String(x).localeCompare(String(y),'ar');
    if(k==='cls')return d*a.c.name.localeCompare(b.c.name,'ar');
    if(S.tools.some(function(t){return t.k===k})){x=a.g[k];y=b.g[k]}
    if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    return d*(x-y);
  });
  return v;
}

}

var CARD_GRID={1:[1,1],2:[1,2],4:[2,2],6:[2,3],8:[2,4],9:[3,3],10:[2,5],12:[3,4]};
function cardHtml(s,w,h,o){
  var c=s.c,T=S.tools,avg=null,big=h>=420;
  var evalH=o.ev?(h>=300?34:0):0,noteH=o.notes&&(getNote(s)||getTags(s).length)?(h>=300?30:0):0;
  var fixed=(big?96:78)+(big?58:46)+evalH+noteH+16;
  var rowH=Math.max(15,Math.min(40,(h-fixed)/Math.max(1,T.length)));
  var fs=Math.max(9,Math.min(15,rowH*0.5)),nfs=Math.max(13,Math.min(26,Math.min(h,w*1.2)/12));
  try{var cx=(nameCol.cv||(nameCol.cv=document.createElement('canvas'))).getContext('2d');cx.font='700 '+nfs+'px "IBM Plex Sans Arabic",sans-serif';var tw=cx.measureText(dname(s)).width*1.06;if(tw>w-28)nfs=Math.max(10,nfs*(w-28)/tw)}catch(e){}
  var p=S.profile,st='width:'+w+'px;height:'+h+'px;';
  var x='<div class="cd" style="'+st+'font-size:'+fs+'px">';
  x+='<div class="cd-top"><span>'+esc(p.school||'')+'</span><span class="cd-cls">'+esc(c.name)+'</span></div>';
  x+='<div class="cd-name" style="font-size:'+nfs+'px">'+esc(dname(s))+'</div>';
  x+='<div class="cd-sum"><div><div class="ps">المجموع</div><b>'+(s.none?'—':fmt(s.calc))+'</b>'+(s.none?'':'<span class="ps"> / '+fmt(s.poss)+'</span>')+'</div><div><div class="ps">النسبة</div><b>'+(s.none?'—':Pp(s.pct))+'</b></div><div><div class="ps">المستوى</div><b class="lv '+s.lv+'">'+LV[s.lv]+'</b></div><div><div class="ps">الترتيب</div><b>'+(s.rank==null?'—':s.rank)+'</b></div></div>';
  x+='<div class="cd-rows">';
  T.forEach(function(t){
    var v=s.g[t.k],xx=s.x[t.k],m=+c.max[t.k]||1,pc=(v!=null&&!xx)?Math.min(100,v/m*100):0;
    x+='<div class="cd-r" style="height:'+rowH+'px"><span class="cd-l">'+esc(t.l)+'</span><span class="cd-v">'+(xx==='a'?'غائب':xx==='e'?'معفى':(v==null?'—':fmt(v)))+'<span class="ps"> / '+fmt(m)+'</span></span><span class="cd-b"><i style="width:'+pc+'%"></i></span></div>';
  });
  x+='</div>';
  if(evalH)x+='<div class="cd-ev">'+esc(evalText(s))+'.</div>';
  if(noteH)x+='<div class="cd-ev cd-note">'+(getTags(s).length?esc(getTags(s).join(' • '))+' — ':'')+esc(getNote(s)).replace(/\n/g,' ')+'</div>';
  return x+'</div>';
}
function cardsPagesHtml(classes,per,o){
  var g=CARD_GRID[per]||CARD_GRID[6],cols=g[0],rows=g[1],gap=8,pw=794-40,ph=1123-40;
  var w=Math.floor((pw-gap*(cols-1))/cols),h=Math.floor((ph-gap*(rows-1))/rows),pages=[];
  classes.forEach(function(c){
    var list=c.students.slice().sort(bySeq).map(function(z){return z});
    for(var i=0;i<list.length;i+=per){
      var chunk=list.slice(i,i+per),hh='<div class="pg port cdpg'+pgCls()+'" style="'+pdfStyle()+'"><div class="phb"></div><div class="cdgrid" style="grid-template-columns:repeat('+cols+',1fr);gap:'+gap+'px">';
      chunk.forEach(function(z){hh+=cardHtml(z,w,h,o)});
      pages.push(hh+'</div></div>');
    }
  });
  return pages;
}
/* html2canvas يقطّع الكلمة إلى أحرف منفصلة إذا امتدّت على أكثر من مستطيل، فتظهر الحروف العربية غير متصلة؛ ندمج المستطيلات في مستطيل واحد */
function fixClone(doc){
  try{
    var R=doc.defaultView.Range.prototype,orig=R.getClientRects;
    R.getClientRects=function(){
      var l=orig.call(this);
      if(!l||l.length<2)return l;
      var a=[].slice.call(l).filter(function(r){return r.width>0});
      if(a.length<2)return l;
      var L=Math.min.apply(0,a.map(function(r){return r.left})),T=Math.min.apply(0,a.map(function(r){return r.top})),
          Rr=Math.max.apply(0,a.map(function(r){return r.right})),B=Math.max.apply(0,a.map(function(r){return r.bottom}));
      var u={left:L,top:T,right:Rr,bottom:B,width:Rr-L,height:B-T,x:L,y:T};
      return [u];
    };
    var sg=doc.getElementById('stage');if(sg){sg.style.position='absolute';sg.style.left='0px';sg.style.top='0px'}
    var st=doc.createElement('style');
    st.textContent='html,body,#stage,.pg,.pg *{-webkit-text-size-adjust:100%;text-size-adjust:100%}.pg,.pg *{letter-spacing:0!important;word-spacing:0!important;font-variant-ligatures:normal;font-kerning:normal;text-rendering:auto}';
    doc.head.appendChild(st);
  }catch(e){}
}
function pagesToPdf(pageHtmls,onProgress){
  var stage=$('stage');
  stage.innerHTML=pageHtmls.join('');
  var els=stage.querySelectorAll('.pg');
  var JS=window.jspdf.jsPDF,doc=null;
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  return ready.then(function(){
    var chain=Promise.resolve();
    for(var i=0;i<els.length;i++)(function(i){
      chain=chain.then(function(){
        if(onProgress)onProgress(i+1,els.length);
        return window.html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,onclone:fixClone,windowWidth:1280,windowHeight:1500,scrollX:0,scrollY:0}).then(function(cv){
          var land=els[i].classList.contains('land');
          if(!doc)doc=new JS({orientation:land?'landscape':'portrait',unit:'mm',format:'a4'});
          else doc.addPage('a4',land?'landscape':'portrait');
          var w=land?297:210,hh=land?210:297;
          doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,w,hh);
        });
      });
    })(i);
    return chain.then(function(){stage.innerHTML='';return doc.output('blob')});
  });
}
function runPdf(htmls,fname,btn,mode){
  var old=btn?btn.textContent:'';
  function st(t){if(btn)btn.textContent=t}
  st('جارٍ تجهيز المكتبات…');
  return Promise.all([ensurePdfLibs(),loadPdfFont()]).then(function(){
    return pagesToPdf(htmls,function(i,n){st('جارٍ إنشاء الصفحة '+i+' من '+n+'…')});
  }).then(function(blob){
    st('بانتظار تأكيد الحفظ…');
    return (mode==='share'?shareFile:saveFile)(fname,blob).then(function(){toast('تم حفظ ملف PDF',false)},saveError);
  }).catch(function(e){
    if(e&&e.code)return;
    toast('تعذّر إنشاء PDF. تحقق من الاتصال بالإنترنت وأعد المحاولة.',false);
  }).then(function(){st(old);$('stage').innerHTML=''});
}

function doRestoreFile(f){

    var n=d.data.classes.length,st=d.data.classes.reduce(function(a,c){return a+(c.st||[]).length},0);
    openModal({title:'استعادة نسخة احتياطية',

      actions:[{label:'استعادة',kind:'danger',fn:function(close){
        close();pushUndo('استعادة نسخة احتياطية');
        load(d.data);S.sample=false;
        Object.keys(d.notes||{}).forEach(function(k){S.nt[k]=d.notes[k]});saveNotes();
        if(d.tg){S.tg=d.tg;saveTags()}if(d.ph){S.ph=d.ph;savePh()}if(d.tl&&d.tl.length){S.tagList=d.tl;saveTagList()}if(d.arch){S.arch=d.arch;saveArch()}
        if(d.pdf&&typeof d.pdf==='object'){Object.keys(S.pdf).forEach(function(k){if(k in d.pdf)S.pdf[k]=d.pdf[k]});savePdf()}
        if(d.profile){Object.keys(S.profile).forEach(function(k){if(typeof d.profile[k]==='string')S.profile[k]=d.profile[k]});saveProfile()}
        persist();showTab('students');toast('تمت الاستعادة',true);

/* رسم الطالب مقابل متوسط الصف */
function wrapLab(t,n){
  var w=t.split(/\s+/),lines=[],cur='';
  w.forEach(function(x){if(cur&&(cur+' '+x).length>n){lines.push(cur);cur=x}else cur=cur?cur+' '+x:x});
  if(cur)lines.push(cur);return lines.slice(0,3);
}
function chartHtml(s){
  var c=s.c,avg=stats(c.students).comp,ts=S.tools.filter(function(t){return c.activeKeys[t.k]});
  if(!ts.length)return '';
  var W=320,H=170,pt=14,pb=52,ph=H-pt-pb,n=ts.length,slot=(W-20)/n,bw=Math.min(34,slot*0.55),lw=Math.max(7,Math.floor(slot/6));
  var g='';
  [0,50,100].forEach(function(v){var y=pt+ph*(1-v/100);g+='<line x1="10" x2="'+(W-10)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'});
  var pts=[],dots='';
  ts.forEach(function(t,i){
    var cx=W-10-slot*(i+.5),x=s.x[t.k],v=s.g[t.k],m=+c.max[t.k]||1;
    var p=x==='a'?0:(x==='e'||v==null?null:Math.min(100,v/m*100));
    if(p!=null){
      var hh=Math.max(2,ph*p/100),top=pt+ph-hh;
      g+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+hh+'" rx="4" fill="'+(p<S.th.lo?'var(--bad)':'var(--accent)')+'"/>';
      if(hh>=22)g+='<text x="'+cx+'" y="'+(top+15)+'" font-size="11" font-weight="700" text-anchor="middle" fill="var(--accent-ink)">'+Math.round(p)+'</text>';
      else g+='<text x="'+cx+'" y="'+(top-4)+'" font-size="11" text-anchor="middle" fill="var(--ink)">'+Math.round(p)+'</text>';
    }else g+='<text x="'+cx+'" y="'+(pt+ph-4)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+(x==='e'?'معفى':'—')+'</text>';
    var ap=avg[t.k].pct;
    if(ap!=null){var ay=pt+ph*(1-Math.min(100,ap)/100);pts.push([cx,ay]);dots+='<circle cx="'+cx+'" cy="'+ay+'" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>'}
    wrapLab(t.l,lw).forEach(function(ln,li){g+='<text x="'+cx+'" y="'+(pt+ph+14+li*12)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+esc(ln)+'</text>'});
  });
  if(pts.length>1)g+='<polyline points="'+pts.map(function(q){return q[0]+','+q[1]}).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".55"/>';
  g+=dots;
  return '<div class="row2" style="margin-top:12px"><div style="font-weight:600;margin-bottom:4px">الطالب مقابل متوسط الصف</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="أعمدة نسب الطالب في كل أداة ودوائر متوسط الصف">'+g+'</svg><div class="sub" style="font-size:12px">الأعمدة: نسبة الطالب. الدوائر: متوسط الصف.</div></div>';
}
/* المتعثرون */
function strugglerInfo(s){
  if(s.none)return null;
  var why=[];
  if(s.lv==='bad')why.push('النسبة '+P(s.pct)+' أقل من '+P(S.th.lo));
  var pts=[];
  S.tools.forEach(function(t){
    if(!s.c.activeKeys[t.k])return;
    var x=s.x[t.k],v=s.g[t.k],m=+s.c.max[t.k]||0;
    if(x==='e')return;
    if(x==='a')pts.push({t:t,p:0});else if(v!=null&&m>0)pts.push({t:t,p:v/m*100});
  });
  if(pts.length>=2){var a=pts[pts.length-2],b=pts[pts.length-1];if(a.p-b.p>=20)why.push('تراجع من '+P(a.p)+' إلى '+P(b.p)+' بين «'+a.t.l+'» و«'+b.t.l+'»')}
  if(s.abs>=2)why.push('غائب في '+s.abs+' أدوات');
  return why.length?why:null;
}

}

function sameJ(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function merge3(b,l,r){
  if(sameJ(l,r))return l;
  if(sameJ(l,b))return r;
  if(sameJ(r,b))return l;
  if(isObj(l)&&isObj(r)){
    var bb=isObj(b)?b:{},out={},keys={};
    Object.keys(l).forEach(function(k){keys[k]=1});Object.keys(r).forEach(function(k){keys[k]=1});
    Object.keys(keys).forEach(function(k){var m=merge3(bb[k],l[k],r[k]);if(m!==undefined)out[k]=m});
    return out;
  }
  return l;
}

function pushDoc(doc,n){
  return encodeDoc(doc).then(function(p){return rpc('gb_push',{p_hash:codeHash(),p_base:Sy.ver,p_data:p})}).then(function(r){
    if(r&&r.ok){Sy.ver=r.ver;Sy.base=doc;saveBase();Sy.dirty=!sameJ(doc,toDoc());saveSy();return}
    if(r&&r.err==='conflict'&&n<4)return cycle(n+1);
    throw new Error((r&&r.err)||'push');
  });
}
function cycle(n){
  return rpc('gb_pull',{p_hash:codeHash(),p_ver:Sy.ver}).then(function(r){
    if(!r||r.ok===false)throw new Error('pull');
    if(r.empty&&Sy.ver>0){syncStop();if(S.tab==='settings')renderSettings();toast('حُذفت النسخة السحابية، فُصل هذا الجهاز وبياناته باقية',false);return}
    if(r.data){
      return decodeDoc(r.data).then(function(remote){
        var local=toDoc(),merged=merge3(Sy.base||{},local,remote);
        if(!sameJ(merged,local)){applyDoc(merged);merged=toDoc()}
        Sy.ver=r.ver;Sy.base=remote;saveBase();
        if(!sameJ(merged,remote)){Sy.dirty=true;saveSy();return pushDoc(merged,n)}
        Sy.dirty=false;saveSy();
      });
    }
    if(Sy.dirty||(r.empty&&!S.sample)){var d=toDoc();if(d.classes)return pushDoc(d,n)}
    Sy.dirty=false;saveSy();
  });
}

    actions:[{label:'إنشاء PDF',fn:function(close){

      ensureQr().then(function(){

        var pages=qrSheetPages(pool,types,n);close();runPdf(pages,'ترويسات-QR-'+new Date().toISOString().slice(0,10)+'.pdf',$('exportBtn'));

function qrSheetPages(pool,types,per){
  var g=QL_GRID[per]||QL_GRID[12],cols=g[0],rows=g[1],gap=6,pw=794-40,ph=1123-40;
  var w=Math.floor((pw-gap*(cols-1))/cols),h=Math.floor((ph-gap*(rows-1))/rows),labels=[];
  types.forEach(function(tk){pool.forEach(function(p){labels.push({p:p,t:tk})})});
  var qs=Math.min(h-16,Math.round(w*0.42),150),pages=[];
  for(var i=0;i<labels.length;i+=per){
    var hh='<div class="pg port cdpg'+pgCls()+'" style="'+pdfStyle()+'"><div class="cdgrid" style="grid-template-columns:repeat('+cols+',1fr);gap:'+gap+'px">';
    labels.slice(i,i+per).forEach(function(l){
      var url=qrCanvasUrl('GB1|'+l.p.sid+'|'+l.t,qs*2);
      hh+='<div class="ql" style="width:'+w+'px;height:'+h+'px"><img src="'+url+'" style="width:'+qs+'px;height:'+qs+'px" alt=""><div class="ql-t"><b>'+esc(l.p.s)+'</b><span>'+esc(l.p.c)+'</span><span class="ql-ty">'+esc(wkTypeLabel(l.t))+'</span></div></div>';
    });
    pages.push(hh+'</div></div>');
  }
  return pages;
}

  var ny=nextYearLabel(S.profile.year)||'';
  var h='<label class="f">العام الدراسي الجديد<input type="text" id="nyYear" value="'+esc(ny)+'" placeholder="مثال: 2027/2028"></label><label class="f">الفصل<input type="text" id="nySem" value="الفصل الأول"></label>';
  h+='<fieldset class="grp"><legend>الصفوف في العام الجديد</legend><p class="sub" style="margin:0 0 6px">عدّل اسم الصف إن تغيّر (ترفيع)، أو علّم «تخرّج» لحذفه. تبقى قوائم الطلاب كما هي.</p>';
  S.classes.forEach(function(c){h+='<div class="nyrow" data-cid="'+c.id+'"><input type="text" class="nyn" value="'+esc(c.name)+'"><label class="opt"><input type="checkbox" class="nyg"> تخرّج / حذف</label></div>'});
  h+='</fieldset><label class="opt"><input type="checkbox" id="nyPh" checked> الاحتفاظ بأرقام أولياء الأمور</label>';
  openModal({title:'بدء عام دراسي جديد',body:h,actions:[{label:'بدء العام الجديد',fn:function(close){
    var yr=$('nyYear').value.trim(),sem=$('nySem').value.trim()||'الفصل الأول';
    if(!yr){toast('اكتب العام الدراسي الجديد',false);return}
    var cfg=[].map.call(document.querySelectorAll('.nyrow'),function(r){return {id:+r.getAttribute('data-cid'),n:r.querySelector('.nyn').value.trim(),g:r.querySelector('.nyg').checked}});
    if(cfg.length&&cfg.every(function(x){return x.g})&&!confirmAllOnce()){return}
    doNewYear(yr,sem,cfg,$('nyPh').checked);close();
  }},{label:'إلغاء',kind:'ghost',fn:function(close){close()}}]});
}
function confirmAllOnce(){var b=$('mdBox').querySelector('[data-mact="0"]');if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='ستُحذف كل الصفوف، اضغط للتأكيد';return false}return true}
function doNewYear(yr,sem,cfg,keepPh){
  archSave((S.profile.sem||'الفصل')+(S.profile.year?' '+S.profile.year:'')+' — أُغلق '+new Date().toLocaleDateString('ar-u-nu-latn'));
  pushUndo('بدء عام دراسي جديد');
  var oldPh=keepPh?JSON.parse(JSON.stringify(S.ph)):{};
  Object.keys(S.nt).forEach(function(k){if(k.indexOf('r:')===0)delete S.nt[k]});S.tg={};S.ph={};
  var keep=[];
  S.classes.forEach(function(c){
    var f=cfg.filter(function(x){return x.id===c.id})[0];
    if(f&&f.g)return;
    var oldName=c.name,nn=(f&&f.n)||c.name;
    c.students.forEach(function(s){
      if(keepPh){var ok=nkeyFor(false,oldName,s.name);if(oldPh[ok])S.ph[nkeyFor(false,nn,s.name)]=oldPh[ok]}
      s.g={};s.x={};s.f=null;
    });
    c.name=nn;keep.push(c);
  });
  S.classes=keep;
  if(!keep.some(function(c){return c.id===S.view}))S.view=keep.length>1?'all':(keep[0]?keep[0].id:'all');
  S.profile.year=yr;S.profile.sem=sem;
  S.wkYear=null;calc();saveNotes();saveTags();savePh();saveProfile();persist();renderCurrent();
  toast('بدأ العام الدراسي '+yr+'، والسابق محفوظ في الأرشيف',true);
}
/* ---- أحداث ---- */
function learnAlias(w){if(w.rd&&w.s){S.al[norm(w.rd)]={c:w.c,s:w.s};saveAl()}}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-wk],[data-yr]');if(!t)return;
  var a=t.getAttribute('data-wk'),y=t.getAttribute('data-yr'),id=t.getAttribute('data-id');
  if(a==='pick'){S.wkFixed=null;$('wkFileIn').click();return}
  if(a==='cam'){S.wkFixed=null;$('wkCamIn').click();return}
  if(a==='qr'){openQrSheets();return}
  if(a==='open'){wkOpen(id);return}
  if(a==='add'){wkAddFor(+id);return}
  if(a==='view'){var yy=t.getAttribute('data-y');wkViewStudent(+id,yy);return}
  if(a==='rvok'){
    var box=t.closest('.wkrv'),si=+box.querySelector('.wkrvs').value,tp=box.querySelector('.wkrvt').value;
    var w=S.wk[id],pl=S.wkOpts||[];
    if(si<0||!pl[si]){toast('اختر الطالب أولًا',false);return}
    if(!tp){toast('اختر نوع الورقة',false);return}
    w.s=pl[si].s;w.c=pl[si].c;w.t=tp;w.src='manual';delete w.rv;delete w.cand;delete w.sg;learnAlias(w);saveWk();renderWorks();toast('تم الاعتماد',false);return;
  }
  if(a==='sgok'){var w1=S.wk[id];if(w1){delete w1.sg;learnAlias(w1);saveWk();renderWorks();toast('اعتُمدت وحُفظت في ملف '+w1.s,false)}return}
  if(a==='sgall'){var n1=0;Object.keys(S.wk).forEach(function(k){var w2=S.wk[k];if(w2.sg&&!w2.rv){delete w2.sg;learnAlias(w2);n1++}});saveWk();renderWorks();toast('اعتُمدت '+n1+' ورقة',false);return}
  if(a==='rvdel'){
    if(!t.getAttribute('data-sure')){t.setAttribute('data-sure','1');t.textContent='تأكيد الحذف';return}
    wkDelete(id);renderWorks();return;
  }
  if(y==='new'){openNewYear();return}
  if(y==='term'){twoStep(t,'تأكيد: تُصفَّر الدرجات',function(){newTerm();renderYears()});return}
  if(y==='xl'){var a1=S.arch.filter(function(x){return x.id===id})[0];if(a1){if(typeof XLSX==='undefined'){toast('تعذّر تحميل مكتبة الإكسل',false);return}archExport(a1)}return}
  if(y==='rest'){var a2=S.arch.filter(function(x){return x.id===id})[0];if(a2)twoStep(t,'تأكيد الاستعادة',function(){archRestore(a2);renderYears()});return}
  if(y==='del'){twoStep(t,'تأكيد الحذف',function(){S.arch=S.arch.filter(function(x){return x.id!==id});saveArch();renderYears();toast('حُذف السجل',false)});return}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='wkFileIn'||t.id==='wkCamIn'){
    var fx=S.wkFixed,ty=S.wkFixT;S.wkFixed=null;S.wkFixT=null;
    var files=t.files;if(!files||!files.length)return;
    var arr=[].slice.call(files);t.value='';
    wkProcessFiles(arr,fx?{fixed:fx,type:ty||'o'}:{});return;
  }
  if(t.id==='wkCls'){S.wkCls=t.value==='all'?'all':+t.value;renderWorks();return}
  if(t.id==='wkTypeSel'){S.wkType=t.value;saveWkPref();return}
  if(t.id==='wkSeq'){S.wkPref.seq=t.checked;saveWkPref();return}
  if(t.id==='wkDirect'){S.wkPref.direct=t.checked;saveWkPref();return}
  if(t.id==='wkYearSel'){S.wkYear=t.value;renderWorks();return}
  if(t.getAttribute&&t.getAttribute('data-wktype')){var w=S.wk[t.getAttribute('data-wktype')];if(w){w.t=t.value;if(w.s&&w.t)delete w.rv;saveWk()}return}
  if(t.id==='yrCur'){S.profile.year=t.value.trim();saveProfile();return}
  if(t.id==='yrSem'){S.profile.sem=t.value.trim();saveProfile();return}
});

if(window.claude&&window.claude.use){
  window.claude.use('downloads').then(function(d){if(d)dl=d},function(){});
}
if(!restore())loadSample();
showTab((location.hash||'').replace('#','')||'students',true);
renderSyncBadge();if(pinData()){lockNow();resetIdle()}
if(Sy.on)setTimeout(syncNow,700);
})();
</script>
</body>
